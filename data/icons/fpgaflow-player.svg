<?xml version="1.0" encoding="UTF-8"?>
<!-- RC10 Player icon: a note over equaliser bars on a deep blue tile, with a
     row of chip pins for the FPGA underneath. Rendered to data/icons/hicolor
     by scripts/render-player-icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a6df0"/>
      <stop offset="0.55" stop-color="#4b3bd6"/>
      <stop offset="1" stop-color="#7a2fc4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="0.6" stop-color="#3ddc84"/>
      <stop offset="0.78" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#ff5a4e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- chip pins along the bottom, behind the tile -->
  <g fill="#e0b44c" stroke="#a8812a" stroke-width="2">
    <rect x="58"  y="206" width="12" height="38" rx="3"/>
    <rect x="86"  y="206" width="12" height="38" rx="3"/>
    <rect x="114" y="206" width="12" height="38" rx="3"/>
    <rect x="142" y="206" width="12" height="38" rx="3"/>
    <rect x="170" y="206" width="12" height="38" rx="3"/>
    <rect x="198" y="206" width="12" height="38" rx="3"/>
  </g>

  <!-- tile -->
  <rect x="18" y="12" width="220" height="214" rx="46" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="18" y="12" width="220" height="110" rx="46" fill="url(#gloss)"/>

  <!-- equaliser bars -->
  <g filter="url(#soft)">
    <rect x="128" y="150" width="20" height="52" rx="5" fill="url(#bar)"/>
    <rect x="156" y="112" width="20" height="90" rx="5" fill="url(#bar)"/>
    <rect x="184" y="132" width="20" height="70" rx="5" fill="url(#bar)"/>
    <rect x="212" y="166" width="14" height="36" rx="5" fill="url(#bar)"/>
  </g>

  <!-- beamed pair of eighth notes -->
  <g fill="#ffffff" filter="url(#soft)">
    <path d="M70 70 L132 54 L132 76 L70 92 Z"/>
    <rect x="70" y="70" width="11" height="102"/>
    <rect x="121" y="54" width="11" height="102"/>
    <ellipse cx="62" cy="174" rx="22" ry="16" transform="rotate(-22 62 174)"/>
    <ellipse cx="113" cy="158" rx="22" ry="16" transform="rotate(-22 113 158)"/>
  </g>
</svg>
