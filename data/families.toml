# FPGA families fpgaflow knows how to synthesise, and the P&R backends for each.
#
# yosys:       the Yosys synthesis command and its family arguments
# top_flag:    the command accepts -top (synth_ecp5 / synth_nexus do not)
# flatten:     how the command handles hierarchy:
#                "flag"    flattens only with -flatten (synth_xilinx, synth)
#                "default" flattens unless given -noflatten
#                "fixed"   has neither option
# backends:    P&R backends in order of preference; the first is the default
# constraints: physical constraint file format
#
# Options were checked against `yosys -h <cmd>` from Yosys 0.71, and every
# family synthesises examples/blinky with it.

[[backend]]
id = "nextpnr"
name = "nextpnr"
netlist = "json"
open_source = true

[[backend]]
id = "vpr"
name = "VTR / VPR"
netlist = "eblif"
open_source = true

[[backend]]
id = "ise"
name = "Xilinx ISE 14.7"
netlist = "edif"
open_source = false

[[backend]]
id = "vivado"
name = "AMD Vivado"
netlist = "edif"
open_source = false

[[backend]]
id = "quartus"
name = "Intel Quartus"
netlist = "vqm"
open_source = false

[[backend]]
id = "efinity"
name = "Efinix Efinity"
netlist = "edif"
open_source = false

# ---------------------------------------------------------------- Lattice
[[family]]
id = "ice40"
name = "Lattice iCE40"
vendor = "lattice"
yosys = "synth_ice40"
top_flag = true
flatten = "default"
backends = ["nextpnr", "vpr"]
constraints = "pcf"

[[family]]
id = "ecp5"
name = "Lattice ECP5"
vendor = "lattice"
yosys = "synth_ecp5"
top_flag = false
flatten = "fixed"
backends = ["nextpnr"]
constraints = "lpf"

[[family]]
id = "nexus"
name = "Lattice Nexus (CrossLink-NX, Certus-NX)"
vendor = "lattice"
yosys = "synth_nexus"
top_flag = false
flatten = "fixed"
backends = ["nextpnr"]
constraints = "pdc"

