# Dev board profiles. Each entry was verified on real hardware unless marked.
#
# program.method       "openfpgaloader" (default) or "celoxica" (fpgaflow-celoxica)
# program.cable        openFPGALoader cable name (-c)
# program.firmware     FX2 firmware for cables that need it; "ise:<file>" is
#                      resolved in ISE's bin/lin64 directory
# program.freq         JTAG clock in Hz (openFPGALoader may round it)
# program.index_chain  position of the FPGA in the JTAG chain
# program.flash_index_chain  position of a JTAG PROM to read/write as flash
# program.flash        what the flash is (shown in messages)
# usb                  VID:PID pairs that mean the board is connected
# bitgen               extra ISE bitgen -g options; a StartupClk here wins
# banks                VCCO per I/O bank in volts, where known (pin planner)
# reserved             pins a design must never use (fpgaflow build refuses
#                      them and tells ISE to PROHIBIT them), with the reason

[[board]]
id = "s3an-starter"
name = "Xilinx Spartan-3AN Starter Kit (HW-SPAR3AN-SK-UNI-G)"
family = "spartan3a"
device = "xc3s700an"
package = "fgg484"
speed = "4"
backend = "ise"
ucf = "boards/s3an-starter.ucf"
usb = ["03fd:000d", "03fd:0008"]
# Verified 2026-11-22: blinky loaded to SRAM. At 6 MHz the IDCODE read
# overflowed (LIBUSB_ERROR_OVERFLOW); 750 kHz is reliable. The chain holds
# the FPGA (index 0) and an XCF04S Platform Flash (index 1). Needs an
# openFPGALoader with the XC3S700AN part entry (IDCODE 0x02628093).
# The cable's FX2 is powered from the board (UG334 Table 17-1: 1.8 V LDO2 for
# the embedded USB programmer), so replugging only USB keeps the firmware
# loaded and it returns as 03fd:0008; a board power cycle returns 03fd:000d.
[board.program]
cable = "xilinxPlatformCableUsb_alt"
firmware = "ise:xusb_emb.hex"
freq = 750000
index_chain = 0
# The XCF04S Platform Flash is second on the chain. The FPGA boots from it
# when the board's configuration mode jumpers select Master Serial.
flash_index_chain = 1
flash = "XCF04S Platform Flash"

[[board]]
id = "rc10"
name = "Celoxica RC10"
family = "spartan3"
device = "xc3s1500"
package = "fg320"
speed = "4"
backend = "ise"
ucf = "boards/rc10.ucf"
# The board's own USB port (Cypress FX2 with Celoxica firmware), seen
# 2026-11-22. It only means "board connected": it is not a JTAG cable.
usb = ["107a:9005"]
# Pins from the Celoxica RC10 manual, section 3; all 183 LOCs checked against
# ISE's xc3s1500fg320 package file. The manual says XC3S1500L-4FG320; this
# board's chip reads XC3S1500 (both have IDCODE 0x01434093).
# The FX2 loads the FPGA in slave SelectMAP mode and drives CCLK, so the
# bitstream starts on CCLK; the other options are Celoxica's (manual 2.9).
# LCK_cycle stays NoWait: Celoxica's 5 would hang start-up in designs
# without a DCM.
bitgen = [
    "StartupClk:Cclk", "DONE_cycle:6", "GTS_cycle:4", "GWE_cycle:Done",
    "DonePin:PullUp", "M0Pin:PullDown", "M1Pin:PullUp", "M2Pin:PullUp",
    "CclkPin:PullNone", "ProgPin:PullNone", "DriveDone:Yes",
]
# Verified 2026-11-22: blinky loaded over the board's USB port (protocol
# read from Celoxica PDK 4.1; see crates/celoxica). The JTAG connector
# (FPGA alone on the chain, manual 3.19) is an alternative with a cable.
# VCCO per bank (schematic sheet 3); banks 0 and 1/2 measured on the board:
# C33 = 1.2 V, JP2 pin 2 (ATAv) = 3.3 V.
banks = { 0 = 1.2, 1 = 3.3, 2 = 3.3, 3 = 2.5, 4 = 3.3, 5 = 3.3, 6 = 2.5, 7 = 2.5 }
[board.program]
method = "celoxica"
# 16 MB NAND behind the FX2; file 1 boots at power-up and on reset.
flash = "16 MB NAND flash (file 1 boots)"
# I/O pins the RC10 wires straight to a supply (schematic sheet 3): driving
# one low would short the rail. Celoxica's PSL library lists the same pins.
[[board.reserved]]
pins = ["A8", "C8", "D8", "E8", "F8"]
reason = "wired to bank 0's VCCO (VccADC, 1.2 V)"
[[board.reserved]]
pins = ["J13"]
reason = "wired to ATAv (banks 1/2 VCCO, 3.3 V via JP2)"
[[board.reserved]]
pins = ["E4", "F5", "G1", "J5", "J6", "K5", "K6", "M18"]
reason = "wired to +2.5 V"
