[package]
name = "fpgaflow-cli"
description = "Command-line front end for fpgaflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "fpgaflow"
path = "src/main.rs"

[dependencies]
fpgaflow-core.workspace = true
fpgaflow-editor.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
fpgaflow-hdl.workspace = true
fpgaflow-sim.workspace = true
fpgaflow-synth.workspace = true
fpgaflow-pnr.workspace = true
fpgaflow-program.workspace = true
fpgaflow-boards.workspace = true
fpgaflow-flow.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
