[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Paul-Chaffey/fpgaflow"
authors = ["Paul Chaffey"]
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
regex = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
nix = { version = "0.29", features = ["signal", "process"] }
which = "7"
dirs = "6"
shell-words = "1"
wait-timeout = "0.2"
tempfile = "3"

fpgaflow-core = { path = "crates/core" }
fpgaflow-editor = { path = "crates/editor" }
fpgaflow-hdl = { path = "crates/hdl" }
fpgaflow-sim = { path = "crates/sim" }
